services:
  caddy:
    container_name: caddy
    image: caddy:2.10-alpine
    restart: on-failure
    ports:
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
